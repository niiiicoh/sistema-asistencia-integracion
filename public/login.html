<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iniciar sesión · Asistencia</title><link rel="stylesheet" href="/css/estilos.css"><script src="/js/comun.js" defer></script><script src="/js/login.js" defer></script></head>
<body><header><a href="/login.html">Asistencia</a></header><main style="max-width:520px"><p class="eyebrow">Registro y control</p><h1>Iniciar sesión</h1><p class="intro">Ingresa con tu correo y contraseña.</p><div id="mensaje" class="message" role="status" hidden></div><form id="login" class="panel"><label>Correo<input name="correo" id="correo" type="email" autocomplete="username" required maxlength="150"></label><label style="margin-top:20px">Contraseña<input name="contrasena" id="contrasena" type="password" autocomplete="current-password" required maxlength="255"></label><button id="ingresar" style="margin-top:24px" type="submit">Ingresar</button></form></main></body></html>
