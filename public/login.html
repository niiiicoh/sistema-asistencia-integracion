<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iniciar sesión · Asistencia</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&display=swap"><link rel="stylesheet" href="/css/estilos.css"><script src="/js/comun.js" defer></script><script src="/js/login.js" defer></script></head>
<body class="login-page"><a class="skip-link" href="#contenido">Saltar al contenido</a>
<aside class="login-brand"><a class="brand" href="/login.html"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span>Asistencia<small>Registro y control</small></span></a><div class="login-intro"><svg class="login-clock" viewBox="0 0 120 120" fill="none" aria-hidden="true"><circle class="face" cx="60" cy="60" r="52" stroke-width="1.5"/><g class="tick" stroke-width="1.5"><path d="M60 12v10M60 98v10M12 60h10M98 60h10"/></g><path d="M60 60V28" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><path d="M60 60l24 14" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><circle cx="60" cy="60" r="3.5" fill="currentColor"/></svg><h2>Registro y control<br>de asistencia.</h2></div></aside>
<main id="contenido" class="login-main" tabindex="-1"><div class="login-content"><h1>Iniciar sesión</h1><p class="intro">Ingresa con tu cuenta de empresa.</p><div id="mensaje" class="message" role="status" aria-live="polite" hidden></div>
<form id="login"><label>Correo<input name="correo" id="correo" type="email" autocomplete="username" placeholder="nombre.apellido@empresa.cl" required maxlength="150"></label><label>Contraseña<input name="contrasena" id="contrasena" type="password" autocomplete="current-password" required maxlength="255"></label><button id="ingresar" type="submit">Ingresar</button></form><p class="login-help">¿Necesitas acceso? Contacta al administrador de tu equipo.</p></div></main>
</body></html>
