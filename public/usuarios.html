<main id="contenido" tabindex="-1"><div class="heading"><div><h1>Gestión de usuarios</h1><p class="intro">Administra los datos y el acceso de tu equipo.</p></div><button id="crear">Crear usuario</button></div><div id="mensaje" class="message" role="status" aria-live="polite" hidden></div>
<section id="editor" class="panel" hidden><h2 id="titulo-form">Crear usuario</h2><form id="formulario"><div class="fields"><label>Nombre<input id="nombre" maxlength="100" autocomplete="given-name" required></label><label>Apellido<input id="apellido" maxlength="100" autocomplete="family-name" required></label><label>Correo<input id="correo" type="email" maxlength="150" readonly placeholder="Se genera al guardar" aria-describedby="correo-ayuda"><span id="correo-ayuda" class="help">Se genera con nombre y apellido. Si ya existe, se agrega un número. El correo se conserva al editar.</span></label><label>Contraseña<input id="contrasena" type="password" maxlength="255" autocomplete="new-password" required><span id="ayuda-clave" class="help" hidden>Deja este campo vacío para conservar la contraseña.</span></label><label>Rol<select id="rol" required><option value="EMPLEADO">Empleado</option><option value="ADMINISTRADOR">Administrador</option></select></label></div><div class="actions"><button type="submit" id="guardar">Guardar usuario</button><button type="button" class="secondary" id="cancelar">Cancelar</button></div></form></section>
<div class="table-wrap" tabindex="0" role="region" aria-label="Tabla de resultados"><table><caption class="help">Usuarios registrados</caption><thead><tr><th scope="col">ID</th><th scope="col">Nombre</th><th scope="col">Apellido</th><th scope="col">Correo</th><th scope="col">Rol</th><th scope="col">Acciones</th></tr></thead><tbody id="usuarios"><tr><td colspan="6" class="empty">Cargando usuarios…</td></tr></tbody></table></div></main><footer>Integración de Competencias II <span>Avance 4</span></footer></body></html>
