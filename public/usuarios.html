<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestión de usuarios · Asistencia</title><link rel="stylesheet" href="/css/estilos.css"><script src="/js/comun.js" defer></script><script src="/js/sesion.js" defer></script><script src="/js/usuarios.js" defer></script></head>
<body><header><a href="/">Asistencia</a><nav aria-label="Principal"><a href="/" data-admin hidden>Inicio</a><a data-admin hidden href="/usuarios.html" aria-current="page">Usuarios</a><a href="/asistencia.html">Asistencia</a><a href="/reportes.html" data-admin hidden>Reportes</a><span id="identidad" class="help" style="color:white"></span><button id="cerrar-sesion" class="secondary">Cerrar sesión</button></nav></header>
<main><div class="heading"><h1>Gestión de usuarios</h1><button id="crear">Crear usuario</button></div><div id="mensaje" class="message" role="status" aria-live="polite" hidden></div>
<section id="editor" class="panel" hidden><h2 id="titulo-form">Crear usuario</h2><form id="formulario"><div class="fields"><label>Nombre<input id="nombre" maxlength="100" autocomplete="given-name" required></label><label>Apellido<input id="apellido" maxlength="100" autocomplete="family-name" required></label><label>Correo<input id="correo" type="email" maxlength="150" readonly placeholder="Se genera al guardar" aria-describedby="correo-ayuda"><span id="correo-ayuda" class="help">Se genera con nombre y apellido. Si ya existe, se agrega un número. El correo se conserva al editar.</span></label><label>Contraseña<input id="contrasena" type="password" maxlength="255" autocomplete="new-password" required><span id="ayuda-clave" class="help" hidden>Deja este campo vacío para conservar la contraseña.</span></label><label>Rol<select id="rol" required><option value="EMPLEADO">Empleado</option><option value="ADMINISTRADOR">Administrador</option></select></label></div><div class="actions"><button type="submit" id="guardar">Guardar usuario</button><button type="button" class="secondary" id="cancelar">Cancelar</button></div></form></section>
<div class="table-wrap"><table><caption class="help">Usuarios registrados</caption><thead><tr><th scope="col">ID</th><th scope="col">Nombre</th><th scope="col">Apellido</th><th scope="col">Correo</th><th scope="col">Rol</th><th scope="col">Acciones</th></tr></thead><tbody id="usuarios"><tr><td colspan="6" class="empty">Cargando usuarios…</td></tr></tbody></table></div></main><footer>Integración de Competencias II · Avance 4</footer></body></html>
